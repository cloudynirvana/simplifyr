# GMGN-exclusive research + paper simulation. Paper only: read-only GMGN key, no signing key, no trade endpoints.
services:
  gmgn:
    build: .
    command: ["tsx", "scripts/gmgn-sim.ts"]
    restart: unless-stopped            # crash/reboot -> comes back by itself
    env_file: /etc/pumpbot/env          # root:docker, mode 640; needs GMGN_API_KEY (read-only), optional TYPESAFE_API_KEY
    volumes:
      - /opt/pumpbot/state:/app/.trading-state   # ledger + heartbeat survive restarts
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/app/.trading-state/heartbeat.json');process.exit(Date.now()-s.mtimeMs<180000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
