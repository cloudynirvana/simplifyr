services:
  scanner:
    build: .
    restart: unless-stopped            # crash/reboot -> comes back without anyone's phone
    env_file: /etc/pumpbot/env          # root-owned, mode 600; never in git
    volumes:
      - /opt/pumpbot/state:/app/.trading-state   # ledger + heartbeat survive container restarts
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      # unhealthy if the heartbeat is older than 3 minutes
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/app/.trading-state/heartbeat.json');process.exit(Date.now()-s.mtimeMs<180000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
